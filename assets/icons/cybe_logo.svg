<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A16"/>
      <stop offset="100%" stop-color="#14142B"/>
    </linearGradient>

    <!-- Primary Neon Gradient (Cyan to Purple) -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>

    <!-- Accent Green/Cyan Gradient -->
    <linearGradient id="accentNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#cyberBg)" stroke="#1E1E38" stroke-width="6"/>

  <!-- Glowing Outer Shield Contour -->
  <path d="M 256,80 
           C 340,80 400,105 400,105
           C 400,280 256,420 256,420
           C 256,420 112,280 112,105
           C 112,105 172,80 256,80 Z"
        fill="none" 
        stroke="url(#primaryNeon)" 
        stroke-width="12" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Solid Shield with Material Gradient -->
  <path d="M 256,110 
           C 320,110 370,130 370,130
           C 370,265 256,380 256,380
           C 256,380 142,265 142,130
           C 142,130 192,110 256,110 Z"
        fill="url(#primaryNeon)" 
        opacity="0.18"/>

  <!-- Material Keyhole / Core Lock Emblem -->
  <!-- Padlock Shackle -->
  <path d="M 216,230 
           V 195 
           C 216,172.9 233.9,155 256,155 
           C 278.1,155 296,172.9 296,195 
           V 230" 
        fill="none" 
        stroke="url(#primaryNeon)" 
        stroke-width="16" 
        stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="196" y="230" width="120" height="96" rx="20" fill="url(#primaryNeon)" filter="url(#neonGlow)"/>

  <!-- Keyhole Core -->
  <circle cx="256" cy="270" r="10" fill="#0A0A16"/>
  <path d="M 252,270 L 248,295 L 264,295 L 260,270 Z" fill="#0A0A16"/>

  <!-- Circuit / Cyber Accent Nodes -->
  <circle cx="150" cy="230" r="6" fill="#00E5FF"/>
  <line x1="156" y1="230" x2="196" y2="230" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <circle cx="362" cy="230" r="6" fill="#7B2FBE"/>
  <line x1="316" y1="230" x2="356" y2="230" stroke="#7B2FBE" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <circle cx="256" cy="350" r="5" fill="#39FF14"/>
  <line x1="256" y1="326" x2="256" y2="345" stroke="#39FF14" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
