name: cybe_app
description: Cybe - Your all-in-one mobile security suite for Android & iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.3.0

  # Secure Storage & Database
  flutter_secure_storage: ^10.3.1
  hive_flutter: ^1.1.0

  # Encryption
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  crypto: ^3.0.3

  # Authentication
  local_auth: ^3.0.2

  # Network & Connectivity
  connectivity_plus: ^6.1.5
  internet_connection_checker_plus: ^3.1.1
  dio: ^5.7.0
  http: ^1.2.2

  # WiFi & Cellular Telephony
  wifi_scan: ^0.4.1
  network_info_plus: ^6.1.4
  carrier_info: ^3.0.0

  # Bluetooth Mesh (BitMesh off-grid messenger)
  flutter_blue_plus: ^1.35.3
  flutter_blue_plus_windows: ^1.25.2


  # Permissions
  permission_handler: ^11.4.0

  # Device Security
  safe_device: ^1.1.6
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.0

  # USB (Android only)
  usb_serial: ^0.5.2

  # File Handling
  file_picker: ^8.3.7
  path_provider: ^2.1.4
  share_plus: ^10.1.4

  # UI & Animations
  dynamic_color: ^1.7.0
  cupertino_icons: ^1.0.8

  fl_chart: ^1.2.0
  lottie: ^3.1.3
  google_fonts: ^8.2.0
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2
  flutter_svg: ^2.0.10+1


  # QR Code
  mobile_scanner: ^7.4.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

dependency_overrides:
  jni: ^1.0.2
  jni_flutter: ^1.0.2

flutter:
  uses-material-design: true

